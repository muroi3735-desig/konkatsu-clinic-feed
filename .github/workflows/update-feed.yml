name: update-agency-feed
on:
  schedule:
    - cron: "0 21 * * *"   # 毎朝6:00（日本時間）
  workflow_dispatch:
  push:
    paths: ["fetch_agency_feed.py", ".github/workflows/update-feed.yml"]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 相談所の発信を取得
        run: python3 fetch_agency_feed.py --out agency-feed.json || true
      - name: 変わっていれば保存
        run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add agency-feed.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "発信データを更新 $(date -u +%F)" && git push)
